name: dfs-storage

x-node: &node
  build: {context: ., args: {BASE: "${DFS_BASE:-mirror.gcr.io/library/python:3.12-slim}"}}
  image: dfs-storage-node:latest
  depends_on: [metadata]
  environment: &node-env
    METADATA_URL: http://metadata:8000
    HEARTBEAT_INTERVAL: "5"

services:
  postgres:
    image: mirror.gcr.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: dfs
      POSTGRES_PASSWORD: dfs
      POSTGRES_DB: dfs
    ports: ["5433:5432"]   # host port 5433 so it does not clash with a local Postgres
    volumes: ["pg-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dfs -d dfs"]
      interval: 3s
      timeout: 3s
      retries: 20

  metadata:
    build: {context: ., args: {BASE: "${DFS_BASE:-mirror.gcr.io/library/python:3.12-slim}"}}
    image: dfs-storage-node:latest
    command: ["uvicorn", "metadata.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql://dfs:dfs@postgres:5432/dfs
      REPLICATION_FACTOR: "3"      # N: 3 full copies per chunk
      WRITE_QUORUM: "2"            # W: a write is acknowledged once 2 copies are stored
      READ_QUORUM: "2"             # R: a read needs 2 replicas to confirm (W + R > N)
      EC_K: "2"                    # erasure coding option: 2 data + 2 parity shards
      EC_M: "2"
      VNODES: "128"
      DEAD_AFTER: "15"             # seconds without a heartbeat before a node counts as failed
      REPAIR_INTERVAL: "10"        # automatic repair pass
      SCRUB_INTERVAL: "300"        # periodic scrub of every node's disk
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}

  node1:
    <<: *node
    environment: {<<: *node-env, NODE_ID: node1, PUBLIC_ADDR: "http://node1:8080"}
    ports: ["8101:8080"]
    volumes: ["node1-data:/data"]

  node2:
    <<: *node
    environment: {<<: *node-env, NODE_ID: node2, PUBLIC_ADDR: "http://node2:8080"}
    ports: ["8102:8080"]
    volumes: ["node2-data:/data"]

  node3:
    <<: *node
    environment: {<<: *node-env, NODE_ID: node3, PUBLIC_ADDR: "http://node3:8080"}
    ports: ["8103:8080"]
    volumes: ["node3-data:/data"]

  node4:
    <<: *node
    environment: {<<: *node-env, NODE_ID: node4, PUBLIC_ADDR: "http://node4:8080"}
    ports: ["8104:8080"]
    volumes: ["node4-data:/data"]

  # Fifth node, only started for the scale-out test:
  #   docker compose --profile scale up -d node5
  node5:
    <<: *node
    profiles: ["scale"]
    environment: {<<: *node-env, NODE_ID: node5, PUBLIC_ADDR: "http://node5:8080"}
    ports: ["8105:8080"]
    volumes: ["node5-data:/data"]

# One named volume per node = each node has its own separate local disk.
volumes:
  pg-data:
  node1-data:
  node2-data:
  node3-data:
  node4-data:
  node5-data:
